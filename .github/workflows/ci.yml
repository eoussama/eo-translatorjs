name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup PNPM
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: pnpm

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Audit Dependencies
      run: pnpm audit

    - name: Type Check
      run: pnpm typecheck

    - name: Lint
      run: pnpm lint

    # Unit and integration tests, failing below 100% coverage.
    - name: Test
      run: pnpm test

    # Also runs publint and attw on the package.
    - name: Build
      run: pnpm build

    - name: Smoke Test
      run: pnpm test:smoke

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Build Docs
      run: pnpm docs:build

    - name: End-to-End Test
      run: pnpm test:e2e

    # Fails below a 95% mutation score.
    - name: Mutation Test
      if: matrix.node == 24
      run: pnpm test:mutation

    - name: Upload Reports
      if: always() && matrix.node == 24
      uses: actions/upload-artifact@v7
      with:
        name: reports
        path: |
          coverage/
          reports/mutation/
          playwright-report/
        if-no-files-found: ignore
